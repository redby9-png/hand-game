    <style>
        /* --- 전체적인 테마 변경 --- */
        body {
            font-family: 'Jua', sans-serif; /* 귀여운 폰트 적용 */
            background-color: #fff3e0; /* 따뜻한 배경색 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
        }

        h1 { margin-bottom: 10px; color: #e65100; /* 진한 주황색 */ }
        
        /* 점수 및 타이머 */
        #score-board { font-size: 1.5rem; color: #e65100; margin-bottom: 10px; }
        #timer-bar-container { width: 300px; height: 12px; background: #ffe0b2; border-radius: 10px; margin-bottom: 20px; overflow: hidden; border: 2px solid #ffb74d;}
        #timer-bar { width: 100%; height: 100%; background: #ff9800; transition: width linear; border-radius: 10px; }

        /* --- 🐱 고양이 캐릭터 디자인 시작 --- */
        .character-container {
            position: relative;
            width: 220px;
            height: 260px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin-bottom: 30px;
            /* filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); 그림자 효과 */
        }

        /* 고양이 머리 */
        .head {
            width: 90px; height: 85px; 
            background: #ffb74d; /* 치즈색 */
            border-radius: 50% 50% 45% 45%; /* 약간 타원형 */
            position: absolute; top: 10px; z-index: 3;
            display: flex; justify-content: center; align-items: center;
            font-size: 45px;
            border: 3px solid #e65100; /* 진한 테두리 */
            box-shadow: inset 0 -5px 10px rgba(0,0,0,0.1);
        }
        
        /* 고양이 귀 (가상 요소 사용) */
        .head::before, .head::after {
            content: '';
            position: absolute;
            bottom: 75%; /* 머리 위로 */
            width: 0; height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 25px solid #ffb74d; /* 머리색과 동일 */
            z-index: -1; /* 머리 뒤로 숨기기 */
        }
        .head::before { left: -5px; transform: rotate(-20deg); border-bottom-color: #e65100; /* 귀 테두리 느낌 */ }
        .head::after { right: -5px; transform: rotate(20deg); border-bottom-color: #e65100; }
        /* 귀 안쪽 색 (이중 가상요소로 표현) */
        .ear-inner-left, .ear-inner-right {
             position: absolute;
             top: -18px;
             width: 0; height: 0;
             border-left: 10px solid transparent;
             border-right: 10px solid transparent;
             border-bottom: 18px solid #ffe0b2; /* 밝은 귀 안쪽 색 */
             z-index: 4;
        }
        .ear-inner-left { left: 5px; transform: rotate(-20deg); }
        .ear-inner-right { right: 5px; transform: rotate(20deg); }

            border: 3px solid #e65100;
